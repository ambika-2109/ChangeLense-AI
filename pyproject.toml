[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changelens-ai"
version = "0.1.0"
description = "Deterministic Terraform change analysis with evidence-backed risk reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "networkx>=3.3,<4.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
changelens = "changelens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/changelens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
